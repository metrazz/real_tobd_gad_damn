version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 10s
      timeout: 5s
      retries: 5

  prefect:
    image: prefecthq/prefect:2.14.10-python3.11
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_API_URL: http://prefect:4200/api
    ports:
      - "4200:4200"
    depends_on:
      - postgres

  agent:
    image: prefecthq/prefect:2.14.10-python3.11
    entrypoint: /bin/bash
    command:
      - -lc
      - |
        prefect config set PREFECT_API_URL=http://prefect:4200/api
        prefect agent start -q default
    working_dir: /opt/flows
    volumes:
      - ./:/opt/flows
    environment:
      DATABASE_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/moex
      DASK_SCHEDULER: tcp://scheduler:8786
    depends_on:
      - prefect
      - scheduler
      - postgres

  scheduler:
    image: daskdev/dask:latest
    command: ["dask-scheduler"]
    ports:
      - "8786:8786"
      - "8787:8787"
    depends_on:
      - postgres

  worker:
    image: daskdev/dask:latest
    command: ["dask-worker", "tcp://scheduler:8786"]
    environment:
      EXTRA_APT_PACKAGES: "git"
    volumes:
      - ./:/opt/flows
    depends_on:
      - scheduler

  streamlit:
    image: prefecthq/prefect:2.14.10-python3.11
    entrypoint: /bin/bash
    working_dir: /opt/flows
    command:
      - -lc
      - |
        pip install -r requirements.txt
        streamlit run dashboards/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      DATABASE_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/moex
    volumes:
      - ./:/opt/flows
    ports:
      - "8501:8501"
    depends_on:
      - postgres

volumes:
  postgres_data:
